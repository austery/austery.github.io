<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />

    <!-- 字体：Playfair Display (英文展示) + Noto Serif SC (中文) + JetBrains Mono (代码/元数据) -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/main.css" />
    <link href="/pagefind/pagefind-ui.css" rel="stylesheet">
  </head>
  <body>
    <div class="page-wrapper">

      <header class="site-header">
        <!-- 品牌标志 -->
        <a class="site-brand" href="/">
          <span class="site-brand__glyph">◆</span>
          <strong class="site-brand__en">The Learning Grove</strong>
          <span class="site-brand__zh">林间拾穗</span>
        </a>

        <!-- 主导航 -->
        <nav class="main-nav" aria-label="主导航">
          <ul>
            <li><a href="/">首页</a></li>
            <li><a href="/all-areas/">领域</a></li>
            <li><a href="/all-categories/">分类</a></li>
            <li><a href="/all-projects/">专题</a></li>
            <li><a href="/all-tags/">标签</a></li>
            <li><a href="/all-speakers/">演讲者</a></li>
            <li><a href="http://localhost:3333" target="_blank" rel="noopener">🔍 语义搜索</a></li>
            <li><a href="/tool/">工具</a></li>
            <li><a href="/bookshelf/">书架</a></li>
            <li><a href="/about/">关于</a></li>
          </ul>
        </nav>

        <!-- 右侧控件：搜索 + 主题切换 -->
        <div class="search-container">
          <div id="search"></div>
          <button id="theme-toggle" class="theme-toggle" title="切换主题" aria-label="切换深色/浅色主题">
            <span class="theme-toggle-icon">🌙</span>
          </button>
        </div>
      </header>

      <main class="site-content">
        
<div class="search-page" data-pagefind-ignore>

  <header class="search-page__header">
    <p class="search-page__eyebrow">Knowledge Archive</p>
    <h1 class="search-page__title">搜 索</h1>
    <div class="search-page__divider">
      <span class="search-page__divider-line"></span>
      <span class="search-page__divider-glyph">◆</span>
      <span class="search-page__divider-line"></span>
    </div>
    <p class="search-page__subtitle">在 6,000 余篇笔记与文章中检索</p>
  </header>

  <div class="search-page__widget">
    <div id="search-full"></div>
  </div>

</div>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    new PagefindUI({
      element: "#search-full",
      showSubResults: true,
      showImages: false,
      excerptLength: 25,
      translations: {
        placeholder: "输入关键词、人名、主题…",
        clear_search: "清除",
        load_more: "加载更多",
        search_label: "搜索此站点",
        filters_label: "过滤器",
        zero_results: "未找到「[SEARCH_TERM]」的相关内容",
        many_results: "找到 [COUNT] 篇关于「[SEARCH_TERM]」的内容",
        one_result: "找到 [COUNT] 篇关于「[SEARCH_TERM]」的内容",
        alt_search: "未找到「[SEARCH_TERM]」。以下是「[DIFFERENT_TERM]」的结果：",
        search_suggestion: "未找到「[SEARCH_TERM]」。试试：",
        searching: "正在检索「[SEARCH_TERM]」…"
      }
    });

    let _q = new URLSearchParams(window.location.search).get('q');
    if (_q) {
      // Strip Chinese book title marks and punctuation that confuse Pagefind tokenization
      _q = _q.replace(/[《》【】〔〕「」『』〈〉]/g, '').trim();
      setTimeout(() => {
        const input = document.querySelector('#search-full .pagefind-ui__search-input');
        if (input) {
          input.value = _q;
          input.dispatchEvent(new Event('input', { bubbles: true }));
        }
      }, 100);
    }
  });
</script>

      </main>

      <footer class="site-footer">
        <p>&copy; 2025 Austery &nbsp;·&nbsp; All rights reserved.</p>
      </footer>

    </div>

    <script>
      const site_url = "/";
    </script>
    <script src="/js/theme-toggle.js"></script>
    <script src="/pagefind/pagefind-ui.js"></script>
    <script>
      window.addEventListener('DOMContentLoaded', (event) => {
        new PagefindUI({
          element: "#search",
          showSubResults: true,
          showImages: false,
          excerptLength: 15,
          translations: {
            placeholder: "搜索文章...",
            clear_search: "清除",
            load_more: "加载更多结果",
            search_label: "搜索此站点",
            filters_label: "过滤器",
            zero_results: "没有找到 [SEARCH_TERM] 的结果",
            many_results: "[COUNT] 个结果关于 [SEARCH_TERM]",
            one_result: "[COUNT] 个结果关于 [SEARCH_TERM]",
            alt_search: "没有找到 [SEARCH_TERM] 的结果。显示 [DIFFERENT_TERM] 的结果：",
            search_suggestion: "没有找到 [SEARCH_TERM] 的结果。尝试以下搜索之一：",
            searching: "搜索 [SEARCH_TERM]..."
          }
        });
      });
    </script>
  </body>
</html>
